spring:
  datasource:
    url: jdbc:sqlite:target/test-data/fiscalstudy.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

fiscalstudy:
  event-origin: AUTOMATED_TEST
  project-root: ..
  data-dir: target/test-data
  staging-db: target/test-data/staging.db
  analytics-dir: target/test-data/analytics
  acervo-root: target/test-data/materials
  anki:
    network-allowed: false
    enabled: false
    auto-sync-enabled: false
    cloud-sync-enabled: false

