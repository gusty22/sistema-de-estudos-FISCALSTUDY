spring:
  datasource:
    url: jdbc:sqlite:../db/fiscalstudy.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

fiscalstudy:
  # Origem atribuida pelo servidor a toda tentativa gravada por esta instancia.
  # O cliente nao pode promover eventos a REAL_STUDY.
  event-origin: REAL_STUDY

