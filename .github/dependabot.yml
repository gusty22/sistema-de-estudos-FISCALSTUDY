version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /analytics-engine/lab
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible:
        update-types: [minor, patch]
