name: Recorded-day clock validation
on:
  pull_request:
    paths:
      - 'analytics-engine/lab/recorded_day*'
      - 'analytics-engine/lab/test_recorded_day_clock.py'
      - 'analytics-engine/lab/CLOCK_VALIDATION_PROTOCOL.json'
      - '.github/workflows/recorded-day-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recorded-day-${{ github.ref }}
  cancel-in-progress: true
jobs:
  untouched-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: analytics-engine
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Use official Ubuntu mirror in disposable runner
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          found=False
          for filename in ("/etc/apt/sources.list.d/ubuntu.sources","/etc/apt/sources.list"):
              path=Path(filename)
              if path.is_file():
                  found=True
                  text=path.read_text()
                  text=text.replace("http://azure.archive.ubuntu.com/ubuntu","https://archive.ubuntu.com/ubuntu")
                  text=text.replace("https://azure.archive.ubuntu.com/ubuntu","https://archive.ubuntu.com/ubuntu")
                  path.write_text(text)
          if not found:
              raise SystemExit("Ubuntu apt source configuration missing")
          PY
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        timeout-minutes: 10
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install existing experimental requirements
        timeout-minutes: 10
        run: |
          python -m pip install -r lab/requirements-memory-lab.txt
          Rscript -e 'install.packages(c("jsonlite","digest"),repos="https://cloud.r-project.org")'
      - name: Clock transport tests and core R regressions
        run: |
          mkdir -p logs
          python -m compileall -q lab
          python -m unittest discover -s lab -p 'test_recorded_day_clock.py' -v 2>&1 | tee logs/clock-tests.log
          Rscript tests/test_runner.R 2>&1 | tee logs/clock-r-tests.log
      - name: Execute registered untouched human cohort
        run: |
          python lab/recorded_day_experiment.py --download --output lab/runs/recorded-day-ci 2>&1 | tee logs/clock-experiment.log
      - name: Offline replay of both clock arms
        run: |
          python lab/recorded_day_experiment.py --source-run lab/runs/recorded-day-ci --output lab/runs/recorded-day-replay 2>&1 | tee logs/clock-replay.log
          python - <<'PY'
          from pathlib import Path
          import json
          a=Path("lab/runs/recorded-day-ci")
          b=Path("lab/runs/recorded-day-replay")
          left={p.relative_to(a).as_posix():p.read_bytes() for p in a.rglob("*") if p.is_file()}
          right={p.relative_to(b).as_posix():p.read_bytes() for p in b.rglob("*") if p.is_file()}
          assert left==right, "Recorded-day replay differs"
          print(json.dumps({"recorded_day_replay_files":len(left),"differences":0}))
          PY
      - name: Preserve aggregate evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-day-aggregate-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            analytics-engine/logs/clock-*.log
            analytics-engine/lab/runs/recorded-day-ci/criteria.json
            analytics-engine/lab/runs/recorded-day-ci/source-manifest.json
            analytics-engine/lab/runs/recorded-day-ci/summary.json
            analytics-engine/lab/runs/recorded-day-ci/manifest.json
            analytics-engine/lab/runs/recorded-day-ci/failure.json
