name: Learner laboratory
on:
  pull_request:
    paths:
      - 'analytics-engine/**'
      - '.github/workflows/learner-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learner-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: analytics-engine
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install experimental dependencies only
        run: |
          mkdir -p logs
          python -m pip install -r lab/requirements-lab-lock.txt
          Rscript -e 'install.packages(c("jsonlite", "digest"), repos="https://cloud.r-project.org")'
      - name: Software and R regression gates
        run: |
          python -m compileall -q lab
          python -m unittest discover -s lab -p 'test_*.py' -v 2>&1 | tee logs/lab-tests.log
          Rscript tests/test_runner.R 2>&1 | tee logs/r-tests.log
      - name: Execute real R and pyBKT experiment
        run: |
          python lab/run_experiment.py --with-pybkt --seeds 401,431,461,491,521 --output tests/fixtures/learner_lab/run-ci 2>&1 | tee logs/experiment.log
          python lab/audit_run.py tests/fixtures/learner_lab/run-ci
      - name: Repeat experiment and check every artifact
        run: |
          python lab/run_experiment.py --with-pybkt --seeds 401,431,461,491,521 --output tests/fixtures/learner_lab/run-ci-replay 2>&1 | tee logs/replay.log
          python lab/audit_run.py tests/fixtures/learner_lab/run-ci-replay
          python - <<'PY'
          from pathlib import Path
          import json
          a=Path("tests/fixtures/learner_lab/run-ci")
          b=Path("tests/fixtures/learner_lab/run-ci-replay")
          left={p.relative_to(a).as_posix():p.read_bytes() for p in a.rglob("*") if p.is_file()}
          right={p.relative_to(b).as_posix():p.read_bytes() for p in b.rglob("*") if p.is_file()}
          assert left==right, "Replay artifacts differ"
          print(json.dumps({"replay_files_compared":len(left),"differences":0}))
          PY
      - name: Print executed metrics and numerical coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("tests/fixtures/learner_lab/run-ci")
          s=json.loads((root/"summary.json").read_text())
          metrics={m:{k:v for k,v in values.items() if k!="reliability"} for m,values in s["metrics"].items()}
          external=[]
          for folder in sorted(root.glob("replicate-*")):
              st=json.loads((folder/"pybkt-predictions.csv.status.json").read_text())
              external.append({"replicate":folder.name,"numerical_unavailable":sum(len(v.get("numerical_unavailable_event_ids",[])) for v in st["students"].values()),"statuses":{name:v["status"] for name,v in st["students"].items()}})
          print(json.dumps({"source_kind":"SYNTHETIC_BENCHMARK","events":s["event_count"],"targets":s["unique_evaluated_event_count"],"metrics":metrics,"comparisons":s["comparisons"],"external":external,"can_apply":False},sort_keys=True))
          PY
      - name: Preserve synthetic evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learner-lab-synthetic-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            analytics-engine/logs/
            analytics-engine/tests/fixtures/learner_lab/run-ci/
            analytics-engine/tests/fixtures/learner_lab/run-ci-replay/
