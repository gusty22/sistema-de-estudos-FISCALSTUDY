name: Full backend suite with R transport
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-full-suite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install existing transport dependencies
        shell: bash
        run: Rscript -e 'install.packages(c("jsonlite","digest"),repos="https://cloud.r-project.org")'
      - name: Compile and run every Java test; R availability is mandatory
        working-directory: backend
        shell: bash
        run: mvn -B -ntp test-compile -Dfiscalstudy.tests.require-r=true test
      - name: Preserve isolated JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-backend-SYNTHETIC-${{ matrix.os }}-${{ github.run_id }}
          path: backend/target/surefire-reports/
          retention-days: 7
