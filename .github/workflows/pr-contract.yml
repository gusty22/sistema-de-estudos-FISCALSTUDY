name: PR contract
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contract:
    name: PR contract and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Bootstrap owner-authored verifier on first installation only
        if: ${{ hashFiles('.github/scripts/check_pr_contract.py') == '' && github.event.pull_request.head.ref == 'chore/agent-pr-governance-20261030' && github.event.pull_request.user.login == 'gusty22' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python for read-only contract validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Unit checks for PR contract
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify PR author, scope, dependency and branch freshness
        run: python .github/scripts/check_pr_contract.py "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
