name: Backend attempt integrity
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-retry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify retry, persistence and export contracts
        working-directory: backend
        run: >-
          sh mvnw -B -ntp test-compile
          -Dtest=AttemptIdentityRegressionTest,AttemptRetryIntegrityIntegrationTest,ProspectivePredictionIntegrationTest,LearningEvidenceServiceTest,QuestionControllerTest,ProspectiveExportSecurityTest,LocalAccessFilterTest,DatabaseFoundationTest,FsrsReferenceConformanceTest
          test
