name: Study session SQLite integrity
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/study-session-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-transaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and inject SQLite failures and concurrency
        working-directory: backend
        run: mvn -B -ntp test-compile "-Dtest=StudySessionIntegrityTest,StudySessionTransactionIntegrationTest,RoutineAndStudyIntegrationTest,ActiveTimeAndConfidenceIntegrationTest,SchemaBootstrapIntegrationTest,DatabaseFoundationTest,QuarantineSourceExposureIntegrationTest" test
