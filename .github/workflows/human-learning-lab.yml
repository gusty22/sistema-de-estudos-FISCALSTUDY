name: External human learning laboratory
on:
  pull_request:
    paths:
      - 'analytics-engine/lab/public_data_adapters.py'
      - 'analytics-engine/lab/human_*.py'
      - 'analytics-engine/lab/human_memory_adapter.R'
      - 'analytics-engine/lab/test_human_learning.py'
      - 'analytics-engine/lab/individual_calibration.R'
      - '.github/workflows/human-learning-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: human-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retrospective-human-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: analytics-engine
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Use official Ubuntu mirror in disposable runner
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          found=False
          for filename in ("/etc/apt/sources.list.d/ubuntu.sources","/etc/apt/sources.list"):
              path=Path(filename)
              if path.is_file():
                  found=True
                  text=path.read_text()
                  text=text.replace("http://azure.archive.ubuntu.com/ubuntu","https://archive.ubuntu.com/ubuntu")
                  text=text.replace("https://azure.archive.ubuntu.com/ubuntu","https://archive.ubuntu.com/ubuntu")
                  path.write_text(text)
          if not found:
              raise SystemExit("Ubuntu apt source configuration missing")
          PY
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        timeout-minutes: 10
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install existing experimental requirements
        timeout-minutes: 10
        run: |
          python -m pip install -r lab/requirements-memory-lab.txt
          Rscript -e 'install.packages(c("jsonlite","digest"),repos="https://cloud.r-project.org")'
      - name: External adapter and metric tests
        run: |
          mkdir -p logs
          python -m compileall -q lab
          python -m unittest discover -s lab -p 'test_human_learning.py' -v 2>&1 | tee logs/human-tests.log
          Rscript tests/test_runner.R 2>&1 | tee logs/human-r-tests.log
      - name: Execute pinned public human memory sample
        run: |
          python lab/human_learning_experiment.py --download --output lab/runs/human-ci 2>&1 | tee logs/human-experiment.log
      - name: Execute separate official ASSISTments corrected sample
        run: |
          python lab/assistments_experiment.py --download --output lab/runs/assistments-ci 2>&1 | tee logs/human-assistments.log
      - name: Offline snapshot replay and byte comparison
        run: |
          python lab/human_learning_experiment.py --source-run lab/runs/human-ci --output lab/runs/human-replay 2>&1 | tee logs/human-replay.log
          python lab/assistments_experiment.py --source-run lab/runs/assistments-ci --output lab/runs/assistments-replay 2>&1 | tee logs/human-assistments-replay.log
          python - <<'PY'
          from pathlib import Path
          import json
          for name in ("human","assistments"):
              a=Path("lab/runs/"+name+"-ci")
              b=Path("lab/runs/"+name+"-replay")
              left={p.relative_to(a).as_posix():p.read_bytes() for p in a.rglob("*") if p.is_file()}
              right={p.relative_to(b).as_posix():p.read_bytes() for p in b.rglob("*") if p.is_file()}
              assert left==right, name+" offline replay differs"
              print(json.dumps({"dataset":name,"replay_files":len(left),"differences":0}))
          PY
      - name: Preserve aggregate research evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-learning-aggregate-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            analytics-engine/logs/human-*.log
            analytics-engine/lab/runs/human-ci/criteria.json
            analytics-engine/lab/runs/human-ci/summary.json
            analytics-engine/lab/runs/human-ci/manifest.json
            analytics-engine/lab/runs/human-ci/source-manifest.json
            analytics-engine/lab/runs/human-ci/failure.json
            analytics-engine/lab/runs/assistments-ci/criteria.json
            analytics-engine/lab/runs/assistments-ci/summary.json
            analytics-engine/lab/runs/assistments-ci/manifest.json
            analytics-engine/lab/runs/assistments-ci/source-manifest.json
            analytics-engine/lab/runs/assistments-ci/failure.json
