name: Weekly branch integration audit
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  orphan-audit:
    name: Branches without confirmed main integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Read-only branch and pull-request audit
        run: python .github/scripts/audit_orphan_branches.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
